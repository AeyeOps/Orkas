<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>单位换算器</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17211d;background:#f2f5f1;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px}.app{width:min(100%,680px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:#185a43;color:white;display:grid;place-items:center;font-size:22px}.eyebrow{font-size:12px;color:#738078;letter-spacing:.12em;text-transform:uppercase}.top h1{font-size:22px;margin:3px 0 0}.badge{border:1px solid #dce4dd;border-radius:99px;padding:8px 12px;color:#65736a;font-size:12px;background:#fff}.card{background:white;border:1px solid #e4eae4;border-radius:24px;padding:28px;box-shadow:0 18px 50px #193b2610}.label{font-size:13px;font-weight:650;color:#56645b;margin:0 0 12px}.tabs{display:flex;gap:8px;margin-bottom:27px}.tab{border:0;background:#f3f6f3;color:#68756c;padding:10px 15px;border-radius:11px;font:600 13px inherit;cursor:pointer}.tab.active{background:#e4f1e9;color:#185a43}.field{border:1px solid #e1e8e1;border-radius:16px;padding:15px 17px}.field:focus-within{border-color:#4a9a70;box-shadow:0 0 0 3px #4a9a701c}.field-head{display:flex;justify-content:space-between;font-size:12px;color:#748078;margin-bottom:10px}.field-row{display:flex;align-items:center;gap:12px}.field input{min-width:0;flex:1;border:0;outline:0;font-size:27px;font-weight:650;color:#17211d;background:transparent}.field input::placeholder{color:#bcc6be}.select-wrap{position:relative}.field select{appearance:none;border:0;background:#f4f7f4;border-radius:10px;padding:10px 30px 10px 12px;font:600 13px inherit;color:#34473a;cursor:pointer;outline-offset:3px}.select-wrap:after{content:'⌄';position:absolute;right:11px;top:8px;color:#66756a;pointer-events:none}.middle{display:flex;align-items:center;gap:12px;margin:12px 0}.line{height:1px;background:#edf0ed;flex:1}.swap{width:39px;height:39px;border:1px solid #e1e8e1;background:#fff;border-radius:13px;font-size:18px;color:#185a43;cursor:pointer;transition:transform .2s}.swap:hover{transform:rotate(180deg);background:#f1f8f3}.result{background:#f4f8f4;border:0}.result input{color:#185a43}.precision{display:flex;justify-content:space-between;color:#7a877e;font-size:12px;margin-top:17px}.precision strong{color:#3b5142;font-weight:600}.foot{margin-top:17px;text-align:center;color:#89948d;font-size:12px}.foot a{color:#185a43;text-decoration:none}.tab:focus-visible,.swap:focus-visible,select:focus-visible{outline:3px solid #75b88d;outline-offset:2px}@media(max-width:520px){body{padding:20px}.card{padding:21px 17px;border-radius:20px}.top{margin-bottom:18px}.badge{display:none}.field{padding:13px}.field input{font-size:22px}.field select{max-width:138px;padding-left:9px;padding-right:25px;font-size:12px}.tabs{gap:5px}.tab{flex:1;padding:10px 7px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand"><div class="mark" aria-hidden="true">↔</div><div><div class="eyebrow">QUICK CONVERT</div><h1>单位换算器</h1></div></div><span class="badge">即时换算 · 无需联网</span></header>
<section class="card" aria-label="单位换算"><p class="label">选择换算类别</p><div class="tabs" role="tablist" aria-label="换算类别"><button class="tab active" role="tab" aria-selected="true" data-kind="length">长度</button><button class="tab" role="tab" aria-selected="false" data-kind="weight">重量</button><button class="tab" role="tab" aria-selected="false" data-kind="temperature">温度</button></div>
<div class="field"><div class="field-head"><label for="inputValue">输入数值</label><span>FROM</span></div><div class="field-row"><input id="inputValue" type="number" step="any" value="1" aria-label="输入数值"><div class="select-wrap"><select id="fromUnit" aria-label="输入单位"></select></div></div></div>
<div class="middle"><div class="line"></div><button class="swap" id="swap" type="button" aria-label="交换输入和输出单位" title="交换单位">⇅</button><div class="line"></div></div>
<div class="field result"><div class="field-head"><label for="outputValue">换算结果</label><span>TO</span></div><div class="field-row"><input id="outputValue" readonly aria-live="polite" aria-label="换算结果"><div class="select-wrap"><select id="toUnit" aria-label="输出单位"></select></div></div></div>
<div class="precision"><span id="formula">1 米 = 100 厘米</span><strong>实时更新</strong></div></section><footer class="foot">结果按需四舍五入显示 · <a href="#" id="reset">重置为默认值</a></footer></main>
<script>
const units={length:[['m','米',1],['km','千米',1000],['cm','厘米',.01],['mm','毫米',.001],['mi','英里',1609.344],['ft','英尺',.3048],['in','英寸',.0254]],weight:[['kg','千克',1],['g','克',.001],['mg','毫克',1e-6],['lb','磅',.45359237],['oz','盎司',.028349523125],['t','公吨',1000]],temperature:[['c','摄氏度'],['f','华氏度'],['k','开尔文']]};let kind='length';const from=document.querySelector('#fromUnit'),to=document.querySelector('#toUnit'),input=document.querySelector('#inputValue'),output=document.querySelector('#outputValue'),formula=document.querySelector('#formula');
function populate(keep=false){const prevA=from.value,prevB=to.value;from.innerHTML='';to.innerHTML='';units[kind].forEach(([id,name])=>{from.add(new Option(name,id));to.add(new Option(name,id))});if(keep&&units[kind].some(x=>x[0]===prevA))from.value=prevA;if(keep&&units[kind].some(x=>x[0]===prevB))to.value=prevB;else to.selectedIndex=Math.min(1,units[kind].length-1);convert()}
function tempConvert(v,a,b){let c=a==='c'?v:a==='f'?(v-32)*5/9:v-273.15;return b==='c'?c:b==='f'?c*9/5+32:c+273.15}
function fmt(x){if(!Number.isFinite(x))return '—';if(Math.abs(x)<1e-12&&x!==0)return '0';return Number(x.toPrecision(10)).toLocaleString('zh-CN',{maximumSignificantDigits:10})}
function convert(){const v=Number(input.value),a=from.value,b=to.value;if(input.value===''||!Number.isFinite(v)){output.value='';formula.textContent='输入数值以查看换算结果';return}let result;if(kind==='temperature')result=tempConvert(v,a,b);else{const av=units[kind].find(x=>x[0]===a),bv=units[kind].find(x=>x[0]===b);result=v*av[2]/bv[2]}output.value=fmt(result);const an=from.selectedOptions[0]?.text,bn=to.selectedOptions[0]?.text;formula.textContent=`${fmt(v)} ${an} = ${fmt(result)} ${bn}`}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{kind=btn.dataset.kind;document.querySelectorAll('.tab').forEach(x=>{const active=x===btn;x.classList.toggle('active',active);x.setAttribute('aria-selected',active)});populate()}));[input,from,to].forEach(el=>el.addEventListener('input',convert));[from,to].forEach(el=>el.addEventListener('change',convert));document.querySelector('#swap').addEventListener('click',()=>{const a=from.value;from.value=to.value;to.value=a;convert()});document.querySelector('#reset').addEventListener('click',e=>{e.preventDefault();kind='length';document.querySelectorAll('.tab').forEach((x,i)=>{x.classList.toggle('active',i===0);x.setAttribute('aria-selected',i===0)});input.value='1';populate()});populate();
</script></body></html>
