<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f0">
<title>词间 · 单词卡片</title>
<style>
:root{--ink:#20231f;--muted:#85887f;--paper:#f6f5f0;--card:#fffefa;--green:#315c48;--lime:#d9ee79;--line:#e8e7df;--orange:#e6a76b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:28px 42px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px;letter-spacing:-.5px}.brandmark{width:34px;height:34px;border-radius:11px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:20px}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;background:#e8e5d9;display:grid;place-items:center;color:var(--green);font-weight:700}.hero{display:flex;justify-content:space-between;align-items:flex-end;padding:38px 0 28px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--green);font-weight:700}.hero h1{font-size:34px;letter-spacing:-1.5px;margin:9px 0 7px}.hero p{margin:0;color:var(--muted);font-size:14px}.primary{background:var(--green);color:white;border:0;padding:12px 18px;border-radius:12px;font-weight:650;box-shadow:0 4px 12px #315c4825}.primary:hover{background:#244b39}.layout{display:grid;grid-template-columns:minmax(0,1fr) 284px;gap:22px;align-items:start}.mainpanel,.sidepanel{background:var(--card);border:1px solid var(--line);border-radius:20px}.mainpanel{padding:22px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.panelhead h2{font-size:15px;margin:0}.progress-label{color:var(--muted);font-size:12px}.progress{height:5px;background:#eeeee7;border-radius:9px;margin:0 0 22px;overflow:hidden}.progress span{height:100%;display:block;background:#9dbb63;border-radius:9px;transition:width .3s}.flashcard{min-height:310px;border:1px solid #ebeae3;border-radius:17px;background:linear-gradient(145deg,#fffefa,#fbfaf5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;position:relative;cursor:pointer;transition:transform .25s,box-shadow .2s;outline:none}.flashcard:hover{box-shadow:0 8px 24px #252b1a0c}.flashcard:focus-visible{box-shadow:0 0 0 3px #a9c47c}.card-top{position:absolute;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:11px;color:#a1a197}.tag{background:#f0f2e7;color:#67754c;padding:5px 9px;border-radius:30px}.word{font-size:46px;font-weight:720;letter-spacing:-1.8px;margin:9px 0}.phonetic{font-size:15px;color:#93958c}.answer{display:none;margin-top:17px}.flashcard.revealed .answer{display:block;animation:fade .25s}.flashcard.revealed .hint{display:none}.meaning{font-size:22px;font-weight:650;margin-bottom:12px}.example{font-size:14px;line-height:1.6;color:#72766d;max-width:480px}.hint{font-size:12px;color:#999c91;margin-top:34px}.card-actions{display:flex;justify-content:center;align-items:center;gap:12px;margin:17px 0 5px}.iconbtn,.grade{border:1px solid var(--line);background:white;border-radius:11px;color:#62665d;height:42px;min-width:44px}.iconbtn:hover,.grade:hover{border-color:#aab99a;color:var(--green)}.grade{padding:0 17px;font-size:13px;font-weight:650}.grade.easy{background:#f0f5e8;color:#43644b;border-color:#e2e9d9}.grade.hard{background:#fff6ec;color:#a86731;border-color:#f2e8d9}.grade:disabled{opacity:.42;cursor:not-allowed}.studyfoot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-top:10px}.kbd{border:1px solid var(--line);padding:3px 6px;border-radius:5px;background:#fff;color:#777}.sidepanel{padding:21px}.sidepanel h2{font-size:14px;margin:0 0 16px}.stat{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.stat:last-of-type{border:0}.statname{font-size:12px;color:var(--muted)}.statval{font-size:22px;font-weight:700;letter-spacing:-.5px}.statval small{font-size:11px;color:var(--muted);font-weight:500}.weakbox{background:#f6f5ef;border-radius:13px;padding:14px;margin-top:12px}.weakbox strong{font-size:12px}.weakbox p{font-size:12px;color:var(--muted);line-height:1.55;margin:7px 0 0}.decktitle{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.decktitle h2{font-size:14px;margin:0}.decktitle span{font-size:12px;color:var(--muted)}.deck{display:grid;gap:8px}.deckrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;width:100%;color:inherit}.deckrow:hover{border-color:#c5cdb9}.deckrow.active{border-color:#9ab079;background:#fbfcf6}.dot{width:8px;height:8px;border-radius:50%;background:#d9a166;flex:none}.dot.mastered{background:#89a960}.rowword{font-size:13px;font-weight:650;flex:1}.rowmeaning{font-size:12px;color:var(--muted)}.empty{text-align:center;color:var(--muted);font-size:14px;padding:38px 18px}.empty strong{display:block;color:var(--ink);margin-bottom:8px}.modal-backdrop{position:fixed;inset:0;background:#17201976;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(100%,480px);background:var(--card);border-radius:20px;padding:26px;box-shadow:0 20px 70px #121a1640}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:19px}.close{border:0;background:transparent;color:#777;font-size:23px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fffefa;outline:none}.field input:focus,.field textarea:focus{border-color:#839a6f;box-shadow:0 0 0 3px #839a6f22}.field textarea{min-height:78px;resize:vertical}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 15px;color:#62665d}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;background:#253a2e;color:white;border-radius:10px;padding:11px 16px;font-size:13px;transition:.2s;pointer-events:none;z-index:8}.toast.show{transform:translate(-50%,0);opacity:1}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:760px){.shell{padding:18px 16px 32px}.hero{padding:28px 0 20px;align-items:flex-start;gap:14px}.hero h1{font-size:29px}.hero p{font-size:12px}.hero .primary{white-space:nowrap;padding:10px 12px;font-size:12px}.layout{grid-template-columns:1fr}.sidepanel{order:2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{display:block;border:0;padding:7px 0}.statval{font-size:20px}.mainpanel{padding:15px}.flashcard{min-height:280px;padding:25px 18px}.word{font-size:39px}.rowmeaning{display:none}.topbar{padding-bottom:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="brandmark" aria-hidden="true">文</span>词间 <span style="font-size:11px;font-weight:500;color:#999">WORDSPACE</span></div><div class="top-right"><span>今天也进步一点</span><span class="avatar" aria-hidden="true">学</span></div></header>
<section class="hero"><div><div class="eyebrow">YOUR DAILY PRACTICE</div><h1>让每个单词，都记得更久。</h1><p>翻开一张卡片，开启今天的记忆练习。</p></div><button class="primary" id="addOpen">＋ 添加单词</button></section>
<div class="layout"><main><section class="mainpanel" aria-label="单词复习"><div class="panelhead"><h2>今日复习</h2><span class="progress-label" id="progressLabel">准备开始</span></div><div class="progress" aria-label="复习进度"><span id="progressBar" style="width:0%"></span></div><div id="studyArea"></div></section>
<div class="decktitle"><h2>我的词库</h2><span id="deckCount">0 个单词</span></div><div class="deck" id="deck"></div></main>
<aside class="sidepanel"><h2>学习概览</h2><div class="stats"><div class="stat"><div class="statname">词库总量</div><div class="statval" id="totalStat">0</div></div><div class="stat"><div class="statname">尚未掌握</div><div class="statval" id="weakStat">0</div></div><div class="stat"><div class="statname">已掌握</div><div class="statval" id="masteredStat">0</div></div></div><div class="weakbox"><strong>🪴 复习小提示</strong><p>还不熟悉的单词会优先出现。多翻几次，让记忆慢慢扎根。</p></div></aside></div></div>
<div class="modal-backdrop" id="modalBackdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">添加新单词</h2><button class="close" id="closeModal" aria-label="关闭">×</button></div><form id="wordForm"><div class="field"><label for="wordInput">单词 *</label><input id="wordInput" name="word" required maxlength="80" placeholder="例如：serendipity" autocomplete="off"></div><div class="field"><label for="meaningInput">释义 *</label><input id="meaningInput" name="meaning" required maxlength="160" placeholder="例如：意外发现美好事物的能力"></div><div class="field"><label for="exampleInput">例句</label><textarea id="exampleInput" name="example" maxlength="300" placeholder="例如：Finding that little café was pure serendipity."></textarea></div><div class="modalfoot"><button type="button" class="secondary" id="cancelModal">取消</button><button class="primary" type="submit">保存单词</button></div></form></section></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{const KEY='wordspace.cards.v1';const samples=[{id:'s1',word:'serendipity',phonetic:'/ˌser.ənˈdɪp.ə.ti/',meaning:'意外发现美好事物的能力；机缘巧合',example:'Finding that little café was pure serendipity.',mastered:false},{id:'s2',word:'resilient',phonetic:'/rɪˈzɪl.jənt/',meaning:'有韧性的；能迅速恢复的',example:'Children are often remarkably resilient.',mastered:false},{id:'s3',word:'eloquent',phonetic:'/ˈel.ə.kwənt/',meaning:'雄辩的；表达流畅的',example:'She gave an eloquent speech about kindness.',mastered:true}];let cards=[];let currentId=null;let revealed=false;let toastTimer;const $=s=>document.querySelector(s);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{const raw=localStorage.getItem(KEY);cards=raw===null?samples.map(x=>({...x})):JSON.parse(raw);if(!Array.isArray(cards))throw Error();}catch{cards=samples.map(x=>({...x}));notify('本地数据读取失败，已载入示例词卡。');}if(!cards.length)currentId=null;else if(!cards.some(c=>c.id===currentId))currentId=nextCard()?.id??cards[0]?.id;render()}function save(){try{localStorage.setItem(KEY,JSON.stringify(cards));return true}catch{notify('保存失败：浏览器存储空间不可用。');return false}}function nextCard(){return cards.find(c=>!c.mastered)||cards[0]}function notify(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}function render(){if(!currentId&&cards.length)currentId=nextCard().id;const card=cards.find(c=>c.id===currentId);const mastered=cards.filter(c=>c.mastered).length;$('#totalStat').textContent=cards.length;$('#weakStat').textContent=cards.length-mastered;$('#masteredStat').textContent=mastered;$('#deckCount').textContent=`${cards.length} 个单词`;const done=cards.length?mastered:0;$('#progressLabel').textContent=cards.length?`${done} / ${cards.length} 已掌握`:'准备开始';$('#progressBar').style.width=cards.length?`${done/cards.length*100}%`:'0%';const area=$('#studyArea');if(!card){area.innerHTML='<div class="empty"><strong>词库还是空的</strong>添加你的第一个单词，开始积累记忆。</div>';$('#deck').innerHTML='';return}area.innerHTML=`<div class="flashcard ${revealed?'revealed':''}" tabindex="0" role="button" aria-label="${revealed?'答案已显示，点击隐藏':'单词卡片，点击翻开查看答案'}" id="flashcard"><div class="card-top"><span>${cards.indexOf(card)+1} / ${cards.length}</span><span class="tag">${card.mastered?'已掌握':'待加强'}</span></div><div class="word">${escape(card.word)}</div><div class="phonetic">${escape(card.phonetic||'点击翻卡查看释义')}</div><div class="answer"><div class="meaning">${escape(card.meaning)}</div>${card.example?`<div class="example">“${escape(card.example)}”</div>`:''}</div><div class="hint">点击卡片翻开 · 或按空格键</div></div><div class="card-actions"><button class="iconbtn" id="prevBtn" aria-label="上一张">←</button><button class="grade hard" id="hardBtn" ${revealed?'':'disabled'}>还不熟</button><button class="grade easy" id="easyBtn" ${revealed?'':'disabled'}>✓ 已掌握</button><button class="iconbtn" id="nextBtn" aria-label="下一张">→</button></div><div class="studyfoot"><span>卡片可以用键盘操作</span><span><kbd class="kbd">←</kbd> <kbd class="kbd">→</kbd> 切换　<kbd class="kbd">空格</kbd> 翻卡</span></div>`;$('#flashcard').onclick=flip;$('#flashcard').onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}};$('#hardBtn').onclick=()=>grade(false);$('#easyBtn').onclick=()=>grade(true);$('#nextBtn').onclick=()=>move(1);$('#prevBtn').onclick=()=>move(-1);$('#deck').innerHTML=cards.map(c=>`<button class="deckrow ${c.id===currentId?'active':''}" data-id="${escape(c.id)}"><span class="dot ${c.mastered?'mastered':''}"></span><span class="rowword">${escape(c.word)}</span><span class="rowmeaning">${escape(c.meaning)}</span></button>`).join('');document.querySelectorAll('.deckrow').forEach(b=>b.onclick=()=>{currentId=b.dataset.id;revealed=false;render()})}function flip(){revealed=!revealed;render()}function move(dir){if(!cards.length)return;const i=cards.findIndex(c=>c.id===currentId);currentId=cards[(i+dir+cards.length)%cards.length].id;revealed=false;render()}function grade(isMastered){const card=cards.find(c=>c.id===currentId);if(!card)return;card.mastered=isMastered;if(!save())return;const remaining=cards.filter(c=>!c.mastered&&c.id!==currentId);currentId=remaining[0]?.id||cards.find(c=>c.id!==currentId)?.id||currentId;revealed=false;render();notify(isMastered?'标记为已掌握。':'已加入优先复习。')}const backdrop=$('#modalBackdrop');function openModal(){backdrop.classList.add('open');$('#wordInput').focus()}function closeModal(){backdrop.classList.remove('open');$('#wordForm').reset();$('#addOpen').focus()}$('#addOpen').onclick=openModal;$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};$('#wordForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget);const word=String(data.get('word')).trim(),meaning=String(data.get('meaning')).trim(),example=String(data.get('example')).trim();if(!word||!meaning)return;const duplicate=cards.some(c=>c.word.toLocaleLowerCase()===word.toLocaleLowerCase());const card={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),word,meaning,example,phonetic:'',mastered:false};cards.unshift(card);if(!save()){cards.shift();return}currentId=card.id;revealed=true;closeModal();render();notify(duplicate?'已添加同名单词。':'单词已添加，来看看答案吧。')};document.addEventListener('keydown',e=>{if(backdrop.classList.contains('open')){if(e.key==='Escape')closeModal();return}if(e.target.matches('input,textarea,button'))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();flip()}});load()})();
</script></body></html>
