<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1020">
<title>贪吃蛇 · Snake Arcade</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--line:#26334d;--muted:#8d9bb4;--lime:#b9f66a;--cyan:#5de4d1;--text:#f3f6fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a2940 0, var(--bg) 58%);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}.app{width:min(100%,940px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:14px;background:var(--lime);display:grid;place-items:center;color:#17200d;font-size:23px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}h1{font-size:23px;line-height:1;margin:3px 0 0;letter-spacing:-.04em}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.game,.side{background:linear-gradient(145deg,#151f35,#101729);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px #0005}.game{padding:18px}.scoreline{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}.scorebox{display:flex;gap:26px}.label{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.number{font-size:25px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}.best .number{color:var(--cyan)}.canvas-wrap{position:relative;overflow:hidden;border-radius:13px;border:1px solid #26324a;background:#0b1323}canvas{display:block;width:100%;height:auto;aspect-ratio:1}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#09101dcc;text-align:center;padding:24px}.overlay[hidden]{display:none}.overlay-card{max-width:280px}.overlay h2{margin:0 0 5px;font-size:26px;letter-spacing:-.04em}.overlay p{margin:0 0 18px;color:#aab6ca}.btn{border:1px solid #34415c;border-radius:10px;background:#202b42;color:var(--text);padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}.btn:hover{transform:translateY(-1px);border-color:#71819e}.btn:active{transform:translateY(0)}.btn.primary{background:var(--lime);border-color:var(--lime);color:#14200b}.btn:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}.side{padding:19px;display:flex;flex-direction:column;gap:19px}.side h2{font-size:13px;margin:0 0 9px;color:#dce5f3}.difficulty{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.difficulty button{background:#1b263b;border:1px solid #2d3a53;color:#9eacc2;border-radius:8px;padding:8px 4px;font-size:12px;cursor:pointer}.difficulty button[aria-pressed="true"]{background:#273624;border-color:#759d49;color:var(--lime);font-weight:800}.tip{color:var(--muted);font-size:12px;margin:9px 0 0}.divider{height:1px;background:var(--line)}.key{display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 5px;border:1px solid #3a4861;border-bottom-width:2px;border-radius:6px;color:#dbe6f5;font-size:11px;font-weight:700}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:112px;margin:0 auto}.keys button{height:36px;padding:0;background:#1c2940;font-size:16px}.keys .empty{visibility:hidden}.controls{text-align:center}.controls .tip{margin-top:8px}.note{font-size:12px;color:var(--muted);line-height:1.65}.note strong{color:#dce5f3}.mobile-only{display:none}@media(max-width:700px){body{padding:18px 14px;align-items:start}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:16px}.side .divider{display:none}.note{grid-column:1/-1}.mobile-only{display:block}header{margin-bottom:15px}.status{font-size:11px}.game{padding:13px}.actions{margin-top:11px}}@media(max-width:390px){.side{grid-template-columns:1fr}.note{grid-column:auto}.scorebox{gap:19px}.number{font-size:22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="app"><header><div class="brand"><div class="mark" aria-hidden="true">↗</div><div><div class="eyebrow">Arcade / 01</div><h1>贪吃蛇</h1></div></div><div class="status"><span class="dot" id="statusDot"></span><span id="statusText" aria-live="polite">准备就绪</span></div></header>
<div class="layout"><section class="game" aria-label="贪吃蛇游戏区域"><div class="scoreline"><div class="scorebox"><div><div class="label">当前得分</div><div class="number" id="score">000</div></div><div class="best"><div class="label">最高分</div><div class="number" id="best">000</div></div></div><span class="eyebrow" id="levelTag">NORMAL</span></div><div class="canvas-wrap"><canvas id="board" width="480" height="480" role="img" aria-label="贪吃蛇游戏棋盘"></canvas><div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlayTitle">准备好了吗？</h2><p id="overlayText">吃掉闪亮的果实，挑战你的最高分。</p><button class="btn primary" id="overlayButton">开始游戏</button></div></div></div><div class="actions"><button class="btn primary" id="toggleBtn">开始游戏</button><button class="btn" id="restartBtn">重新开始</button></div></section>
<aside class="side"><section><h2>难度</h2><div class="difficulty" role="group" aria-label="选择游戏难度"><button data-speed="180" aria-pressed="false">轻松</button><button data-speed="125" aria-pressed="true">标准</button><button data-speed="82" aria-pressed="false">疾速</button></div><p class="tip">难度可在游戏中随时调整</p></section><div class="divider"></div><section class="controls"><h2>方向控制</h2><div class="keys" aria-label="方向按钮"><span class="empty"></span><button class="btn" data-dir="up" aria-label="向上">↑</button><span class="empty"></span><button class="btn" data-dir="left" aria-label="向左">←</button><button class="btn" data-dir="down" aria-label="向下">↓</button><button class="btn" data-dir="right" aria-label="向右">→</button></div><p class="tip">方向键控制 <span class="mobile-only">· 也可点按</span></p></section><div class="divider"></div><section class="note"><strong>怎么玩</strong><br>收集果实，蛇身会逐渐变长。撞到墙壁或自己，游戏就会结束。按 <span class="key">Space</span> 暂停 / 继续。</section></aside></div></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),overlayTitle=document.querySelector('#overlayTitle'),overlayText=document.querySelector('#overlayText'),overlayButton=document.querySelector('#overlayButton'),toggleBtn=document.querySelector('#toggleBtn'),statusText=document.querySelector('#statusText'),statusDot=document.querySelector('#statusDot'),levelTag=document.querySelector('#levelTag');const N=24,C=20;let snake,food,dir,nextDir,score,best=0,speed=125,timer=null,state='ready';try{best=Number(localStorage.getItem('snake-best'))||0}catch{}bestEl.textContent=String(best).padStart(3,'0');const levels={180:'EASY',125:'NORMAL',82:'FAST'};
function newGame(){clearInterval(timer);snake=[{x:7,y:12},{x:6,y:12},{x:5,y:12}];dir={x:1,y:0};nextDir={...dir};score=0;scoreEl.textContent='000';placeFood();state='ready';render();showOverlay('准备好了吗？','吃掉闪亮的果实，挑战你的最高分。','开始游戏');updateStatus('准备就绪')}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake?.some(p=>p.x===food.x&&p.y===food.y))}
function render(){ctx.fillStyle='#0b1323';ctx.fillRect(0,0,480,480);ctx.strokeStyle='rgba(130,158,194,.055)';ctx.lineWidth=1;for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(480,i*C);ctx.stroke()}ctx.fillStyle='#ff6b82';ctx.shadowColor='#ff5774';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,6.7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;snake.forEach((p,i)=>{const inset=i===0?2.4:3.2;ctx.fillStyle=i===0?'#c7ff78':`rgba(111,205,119,${Math.max(.55,1-i*.018)})`;ctx.beginPath();ctx.roundRect(p.x*C+inset,p.y*C+inset,C-inset*2,C-inset*2,i===0?6:5);ctx.fill()});const h=snake[0];ctx.fillStyle='#17200d';const eyeX=dir.x===1?14:dir.x===-1?6:dir.x===0?7:null;ctx.beginPath();if(dir.x!==0){ctx.arc(h.x*C+eyeX,h.y*C+7,1.2,0,7);ctx.arc(h.x*C+eyeX,h.y*C+13,1.2,0,7)}else{ctx.arc(h.x*C+7,h.y*C+(dir.y===1?14:6),1.2,0,7);ctx.arc(h.x*C+13,h.y*C+(dir.y===1?14:6),1.2,0,7)}ctx.fill()}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=head.x===food.x&&head.y===food.y;if(head.x<0||head.y<0||head.x>=N||head.y>=N||snake.slice(0,eats?undefined:-1).some(p=>p.x===head.x&&p.y===head.y)){endGame();return}snake.unshift(head);if(eats){score+=10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;bestEl.textContent=String(best).padStart(3,'0');try{localStorage.setItem('snake-best',String(best))}catch{}}placeFood()}else snake.pop();render()}
function start(){if(state==='running')return;overlay.hidden=true;state='running';clearInterval(timer);timer=setInterval(tick,speed);toggleBtn.textContent='暂停';updateStatus('游戏进行中')}
function pause(){if(state!=='running')return;clearInterval(timer);timer=null;state='paused';showOverlay('游戏已暂停','稍作休息，准备好后继续。','继续游戏');toggleBtn.textContent='继续';updateStatus('已暂停')}
function endGame(){clearInterval(timer);timer=null;state='over';showOverlay('游戏结束',`本局得分 ${score} · 再来一局？`,'重新开始');toggleBtn.textContent='重新开始';updateStatus('游戏结束')}
function showOverlay(title,text,button){overlayTitle.textContent=title;overlayText.textContent=text;overlayButton.textContent=button;overlay.hidden=false}
function updateStatus(s){statusText.textContent=s;statusDot.style.background=state==='running'?'var(--lime)':state==='over'?'#ff6b82':'#8d9bb4';statusDot.style.boxShadow=state==='running'?'0 0 10px var(--lime)':'none'}
function setDirection(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-dir.x&&d.y===-dir.y)return;nextDir=d;if(state==='ready')start()}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}else if(e.code==='Space'){e.preventDefault();state==='running'?pause():state==='paused'?start():state==='ready'?start():newGame()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{speed=Number(b.dataset.speed);levelTag.textContent=levels[speed];document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(state==='running'){clearInterval(timer);timer=setInterval(tick,speed)}}));toggleBtn.addEventListener('click',()=>state==='running'?pause():state==='paused'||state==='ready'?start():newGame());overlayButton.addEventListener('click',()=>{if(state==='paused')start();else if(state==='over'){newGame();start()}else start()});document.querySelector('#restartBtn').addEventListener('click',()=>{newGame();start()});newGame();
})();
</script></body></html>
