<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f5">
<title>库存台账 · 商品管理</title>
<style>
:root{color-scheme:light;--ink:#17221d;--muted:#626e67;--line:#e8ece8;--green:#176b4b;--pale:#e9f4ee;--bg:#f6f7f5;--white:#fff;--red:#b83d36;--shadow:0 10px 34px #15231b0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1160px;margin:auto;padding:34px 36px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:52px}.brand{display:flex;align-items:center;gap:11px;font-size:16px;font-weight:750;letter-spacing:-.3px}.brand-icon{width:36px;height:36px;border-radius:11px;background:var(--green);color:white;display:grid;place-items:center}.brand-icon svg{width:20px}.top-note{font-size:13px;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;gap:20px}.eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--green);font-weight:750;margin:0 0 8px}.intro h1{font-size:34px;letter-spacing:-1.1px;line-height:1.15;margin:0}.subtitle{margin:10px 0 0;color:var(--muted)}.primary{border:0;border-radius:9px;background:var(--green);color:white;font-weight:650;padding:11px 16px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 8px #176b4b20}.primary:hover{background:#12593e}.primary:focus-visible,.secondary:focus-visible,.icon-btn:focus-visible,.search:focus-visible,input:focus-visible{outline:3px solid #69bb94;outline-offset:2px}.plus{font-size:21px;line-height:16px;font-weight:400}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:19px 21px;box-shadow:var(--shadow)}.stat-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#92c7a8}.dot.amber{background:#e6ad54}.dot.blue{background:#82a8cc}.stat-value{font-size:27px;font-weight:720;letter-spacing:-.8px;margin-top:8px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:27px 0 13px;gap:16px}.section-title{font-size:16px;font-weight:700}.count{font-size:12px;color:var(--muted);font-weight:500;margin-left:7px}.search-wrap{position:relative;width:min(280px,45%)}.search-icon{position:absolute;left:12px;top:10px;width:17px;height:17px;color:#89938e}.search{width:100%;border:1px solid #e1e6e2;background:white;border-radius:8px;padding:9px 12px 9px 37px;color:var(--ink)}.search::placeholder{color:#a1aaa5}.table-wrap{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;text-align:left}thead{background:#fafbfa}th{height:45px;padding:0 21px;font-size:11px;color:#626e67;letter-spacing:.65px;font-weight:700;text-transform:uppercase}td{padding:15px 21px;border-top:1px solid #edf0ed;font-size:14px}tbody tr:hover{background:#fcfdfc}.product{font-weight:650}.price{font-variant-numeric:tabular-nums}.stock{font-variant-numeric:tabular-nums}.stock-pill{display:inline-flex;align-items:center;gap:7px}.stock-pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#63a77f}.stock-pill.low:before{background:#e4a34a}.stock-pill.out:before{background:#d66d65}.stock-pill.low,.stock-pill.out{color:#a9632a}.stock-pill.out{color:#b34840}.actions{display:flex;justify-content:flex-end;gap:7px}.icon-btn{width:33px;height:33px;border:1px solid transparent;border-radius:7px;background:transparent;color:#7a8580;display:grid;place-items:center}.icon-btn:hover{background:#f1f5f2;color:var(--green)}.icon-btn.delete:hover{background:#fff1f0;color:var(--red)}.icon-btn svg{width:16px;height:16px}.empty{text-align:center;padding:58px 16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}.empty button{margin-top:15px}.status{min-height:22px;margin:12px 2px;color:var(--green);font-size:13px}.status.error{color:var(--red)}dialog{border:0;padding:0;width:min(440px,calc(100% - 32px));border-radius:15px;box-shadow:0 24px 80px #12201930;color:var(--ink)}dialog::backdrop{background:#10201970;backdrop-filter:blur(2px)}.modal{padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:21px}.modal h2{font-size:20px;margin:0;letter-spacing:-.4px}.modal-desc{margin:5px 0 0;color:var(--muted);font-size:13px}.close{border:0;background:transparent;color:#78827c;font-size:23px;line-height:1;padding:0 3px}.field{display:block;margin:15px 0}.field span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input{width:100%;border:1px solid #dfe5e0;border-radius:8px;padding:10px 11px;background:white}.field input::placeholder{color:#a2aaa5}.field input[aria-invalid=true]{border-color:var(--red)}.hint{font-size:12px;color:var(--muted);margin-top:4px}.form-error{color:var(--red);min-height:20px;font-size:13px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.secondary{border:1px solid #dfe5e0;border-radius:8px;background:white;padding:10px 15px;color:#35413a;font-weight:600}.confirm-copy{color:var(--muted);margin:12px 0 22px}.danger{background:var(--red)}.danger:hover{background:#9e302b}footer{margin-top:21px;color:#626e67;font-size:12px;display:flex;justify-content:space-between;gap:10px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:680px){.shell{padding:22px 16px 36px}.topbar{margin-bottom:36px}.top-note{display:none}.intro{align-items:flex-start;flex-direction:column}.intro h1{font-size:29px}.stats{gap:8px}.stat{padding:14px 12px}.stat-label{font-size:11px;gap:5px}.stat-value{font-size:22px}.toolbar{align-items:flex-start}.search-wrap{width:52%}.table-wrap{overflow-x:auto}table{min-width:570px}th,td{padding-left:14px;padding-right:14px}footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 7 8-4 8 4v10l-8 4-8-4z"/><path d="m4 7 8 4 8-4M12 11v10M8 5l8 4"/></svg></span>库存台账</div><div class="top-note">轻松管理每一件商品</div></header>
<main><section class="intro"><div><p class="eyebrow">Inventory overview</p><h1>商品库存</h1><p class="subtitle">清晰掌握商品与库存动态</p></div><button class="primary" id="addBtn"><span class="plus" aria-hidden="true">+</span>添加商品</button></section>
<section class="stats" aria-label="库存统计"><article class="stat"><div class="stat-label"><i class="dot"></i>商品种类</div><div class="stat-value" id="kindStat">0</div></article><article class="stat"><div class="stat-label"><i class="dot blue"></i>库存总量</div><div class="stat-value" id="unitsStat">0</div></article><article class="stat"><div class="stat-label"><i class="dot amber"></i>库存金额</div><div class="stat-value" id="valueStat">¥0.00</div></article></section>
<div class="toolbar"><div class="section-title">全部商品 <span class="count" id="countLabel">0 件</span></div><div class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><label class="sr-only" for="search">搜索商品名称</label><input id="search" class="search" type="search" placeholder="搜索商品…" autocomplete="off"></div></div>
<div class="table-wrap"><table><thead><tr><th scope="col">商品名称</th><th scope="col">售价</th><th scope="col">库存数量</th><th scope="col" style="text-align:right">操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden><strong id="emptyTitle">还没有商品</strong><span id="emptyCopy">添加第一件商品，开始管理库存。</span><br><button class="primary" id="emptyAdd"><span class="plus" aria-hidden="true">+</span>添加商品</button></div></div><p id="status" class="status" role="status" aria-live="polite"></p>
</main><footer><span>数据保存在此浏览器中</span><span>商品售价与库存随时可更新</span></footer></div>
<dialog id="productDialog" aria-labelledby="formTitle"><form class="modal" id="productForm"><div class="modal-head"><div><h2 id="formTitle">添加商品</h2><p class="modal-desc">填写商品信息，稍后也可以修改。</p></div><button class="close" type="button" data-close aria-label="关闭">×</button></div><label class="field"><span>商品名称</span><input id="name" name="name" maxlength="80" placeholder="例如：无线耳机" required autocomplete="off"><span class="hint">最多 80 个字符</span></label><label class="field"><span>售价（元）</span><input id="price" name="price" type="number" min="0" max="100000000" step="0.01" placeholder="0.00" required></label><label class="field"><span>库存数量</span><input id="quantity" name="quantity" type="number" min="0" max="100000000" step="1" placeholder="0" required></label><p class="form-error" id="formError" role="alert"></p><div class="modal-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary" type="submit" id="saveBtn">保存商品</button></div></form></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle"><div class="modal"><div class="modal-head"><div><h2 id="deleteTitle">删除商品？</h2><p class="modal-desc">此操作无法撤销</p></div><button class="close" type="button" data-close aria-label="关闭">×</button></div><p class="confirm-copy" id="deleteCopy"></p><div class="modal-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary danger" type="button" id="confirmDelete">删除商品</button></div></div></dialog>
<script>
(()=>{'use strict';
const KEY='inventory-ledger-products-v1', rows=document.querySelector('#rows'), empty=document.querySelector('#empty'), search=document.querySelector('#search'), status=document.querySelector('#status'), form=document.querySelector('#productForm'), productDialog=document.querySelector('#productDialog'), deleteDialog=document.querySelector('#deleteDialog');let products=[], editingId=null, deletingId=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function announce(message,error=false){status.textContent=message;status.classList.toggle('error',error)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(products));return true}catch(e){announce('保存失败：浏览器存储不可用或空间不足，请检查浏览器设置后重试。',true);return false}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw===null)return;const parsed=JSON.parse(raw);if(Array.isArray(parsed))products=parsed.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(p.price)&&Number.isInteger(p.quantity)&&p.price>=0&&p.quantity>=0)}catch(e){announce('无法读取已保存的数据；现有数据保持不变。',true)}}
function render(){const query=search.value.trim().toLocaleLowerCase('zh-CN');const visible=products.filter(p=>p.name.toLocaleLowerCase('zh-CN').includes(query));document.querySelector('#kindStat').textContent=products.length.toLocaleString('zh-CN');document.querySelector('#unitsStat').textContent=products.reduce((sum,p)=>sum+p.quantity,0).toLocaleString('zh-CN');document.querySelector('#valueStat').textContent=money(products.reduce((sum,p)=>sum+p.price*p.quantity,0));document.querySelector('#countLabel').textContent=`${products.length} 件`;rows.innerHTML=visible.map(p=>{const stock=p.quantity===0?'out':p.quantity<=5?'low':'';return `<tr><td class="product">${escapeHTML(p.name)}</td><td class="price">${money(p.price)}</td><td class="stock"><span class="stock-pill ${stock}">${p.quantity.toLocaleString('zh-CN')} 件${p.quantity===0?' · 缺货':p.quantity<=5?' · 库存偏低':''}</span></td><td><div class="actions"><button class="icon-btn" data-action="edit" data-id="${escapeHTML(p.id)}" aria-label="编辑 ${escapeHTML(p.name)}" title="编辑"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m14 5 5 5M4 20l4.5-.9L19 8.6a2.1 2.1 0 0 0-3-3L5.5 16.1 4 20Z"/></svg></button><button class="icon-btn delete" data-action="delete" data-id="${escapeHTML(p.id)}" aria-label="删除 ${escapeHTML(p.name)}" title="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5.5 7l1 13h11l1-13M9 7V4h6v3"/></svg></button></div></td></tr>`}).join('');empty.hidden=visible.length!==0;document.querySelector('#emptyTitle').textContent=products.length?'没有找到匹配的商品':'还没有商品';document.querySelector('#emptyCopy').textContent=products.length?'试试其他商品名称。':'添加第一件商品，开始管理库存。';document.querySelector('#emptyAdd').hidden=products.length>0}
function openForm(product=null){editingId=product?.id||null;form.reset();document.querySelector('#formTitle').textContent=product?'编辑商品':'添加商品';document.querySelector('.modal-desc').textContent=product?'修改商品信息，保存后立即更新。':'填写商品信息，稍后也可以修改。';document.querySelector('#saveBtn').textContent=product?'保存修改':'保存商品';document.querySelector('#formError').textContent='';if(product){form.name.value=product.name;form.price.value=product.price;form.quantity.value=product.quantity}productDialog.showModal();form.name.focus()}
document.querySelector('#addBtn').addEventListener('click',()=>openForm());document.querySelector('#emptyAdd').addEventListener('click',()=>openForm());document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));search.addEventListener('input',render);
rows.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const item=products.find(p=>p.id===btn.dataset.id);if(!item)return;if(btn.dataset.action==='edit')openForm(item);else{deletingId=item.id;document.querySelector('#deleteCopy').textContent=`「${item.name}」將從庫存清單中移除。`;deleteDialog.showModal();document.querySelector('#confirmDelete').focus()}});
form.addEventListener('submit',e=>{e.preventDefault();const name=form.name.value.trim(),price=Number(form.price.value),quantity=Number(form.quantity.value),error=document.querySelector('#formError');error.textContent='';if(!name){error.textContent='請輸入商品名稱。';form.name.focus();return}if(!Number.isFinite(price)||price<0||price>100000000){error.textContent='請輸入有效的非負售價。';form.price.focus();return}if(!Number.isSafeInteger(quantity)||quantity<0||quantity>100000000){error.textContent='庫存數量必須是有效的非負整數。';form.quantity.focus();return}const previous=products;if(editingId)products=products.map(p=>p.id===editingId?{...p,name,price,quantity}:p);else products=[...products,{id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`,name,price,quantity}];if(!persist()){products=previous;return}productDialog.close();render();announce(editingId?'商品已更新。':'商品已添加。')});
document.querySelector('#confirmDelete').addEventListener('click',()=>{const previous=products;products=products.filter(p=>p.id!==deletingId);if(!persist()){products=previous;return}deleteDialog.close();render();announce('商品已删除。');deletingId=null});
productDialog.addEventListener('click',e=>{if(e.target===productDialog)productDialog.close()});deleteDialog.addEventListener('click',e=>{if(e.target===deleteDialog)deleteDialog.close()});load();render();
})();
</script>
</body></html>
