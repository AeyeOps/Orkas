[package]
name = "orkas-phone-passkey"
version = "0.1.0"
edition = "2021"
[dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", features = ["cable"] }
webauthn-rs-proto = "=0.5.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
qrcode = { version = "0.12", default-features = false, features = ["svg"] }

openssl = { version = "0.10", features = ["vendored"] }

[patch.crates-io]
webauthn-authenticator-rs = { path = "vendor/webauthn-authenticator-rs" }

[profile.release]
strip = true
